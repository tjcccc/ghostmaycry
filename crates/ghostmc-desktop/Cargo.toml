[package]
name = "ghostmc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ghostmc-desktop"
path = "src/main.rs"

[dependencies]
ghostmc-core.workspace = true
ghostmc-tmux.workspace = true
ghostmc-protocol.workspace = true
ghostmc-platform.workspace = true
ghostmc-host.workspace = true
anyhow = "1.0.104"
gpui = "=0.2.2"
serde_json = "1.0.154"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
futures = "0.3"
log = "0.4"

# Menu-bar item. These crates (and their versions) already come with GPUI on
# macOS; only features are added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGlassEffectView",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"
resvg = "0.45"
